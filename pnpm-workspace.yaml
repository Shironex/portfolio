onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - protobufjs
  - sharp
  - unrs-resolver

overrides:
  minimatch@9: ">=9.0.7"
  rollup@4: ">=4.59.0"
  handlebars: ">=4.7.10"
  flatted: ">=3.4.2"
  picomatch@4: ">=4.0.4"
  micromatch>picomatch: ">=4.0.4"
  brace-expansion@1: "^1.1.13"
  brace-expansion@>=5: ">=5.0.12"
  dompurify: ">=3.4.11"
  lodash: ">=4.18.1"
  lodash-es: ">=4.18.1"
  fast-uri@3: "^3.1.8"
  engine.io@6: "~6.6.10"
  socket.io-parser: ">=4.2.6"
  postcss: ">=8.5.10"
  undici@6: "^6.29.0"
  undici@7: "^7.30.0"
  # @react-email/ui ships a prebuilt .next for 16.3.x; keep it on that line (16.4 breaks the preview).
  "@react-email/ui>next": "16.3.8"
  js-yaml@4: "^4.1.1"
  js-yaml@5: "^5.4.1"
  esbuild: ">=0.28.1"
  "@babel/core@7": "^7.29.6"
  ws: ">=8.20.1"

# @noctcore packages are published by the owner and may be installed as soon as
# they are out. The pinned pnpm 10.9.0 enforces neither the gate nor this
# exclusion; newer pnpm releases read both.
minimumReleaseAgeExclude:
  - '@noctcore/*'
