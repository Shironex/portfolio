name: Release

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release itself declares engines ^22.14.0 || >=24.10.0, but the
      # two plugins below declare ^22.22.2 || >=24.15. A runner sitting between
      # those, say Node 24.12, satisfies the tool and fails the plugins. The job
      # never runs `pnpm install`, so nothing else decides the version either:
      # without this step it is whatever the runner image happens to ship.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node v5 turns its package cache on by itself when
          # package.json names a `packageManager`, and then calls pnpm to find
          # the store. This job installs no pnpm, so the step fails with
          # "Unable to locate executable file: pnpm". Nothing is installed
          # here, so there is nothing to cache either.
          package-manager-cache: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v4
        with:
          # The action bundles its own copies of the semantic-release plugins and
          # never runs `pnpm install`, so the versions in package.json are not the
          # ones that execute here. Pinning them explicitly keeps CI in step with
          # the manifest.
          extra_plugins: |
            @semantic-release/changelog@^7.0.0
            @semantic-release/git@^11.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
