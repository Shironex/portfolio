version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels: ['dependencies']
    commit-message:
      prefix: 'build(deps)'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']
